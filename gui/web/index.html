<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashCard App</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="app">

    <!-- Top navigation bar -->
    <div id="topbar">
      <div id="topbar-left">
        <button id="back-btn" class="btn-ghost" data-action="goBack" style="display:none">
          &#8249; Back
        </button>
      </div>
      <div id="topbar-center">
        <span id="topbar-title">Flashcard App</span>
      </div>
      <div id="topbar-right">
        <div id="topbar-actions"></div>
        <button id="settings-btn" class="icon-btn" data-action="navigate" data-page="settings" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Page content -->
    <div id="content">
      <div class="spinner"></div>
    </div>

  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <!-- Confirm dialog -->
  <div id="overlay" class="overlay" style="display:none" data-action="closeOverlay">
    <div class="modal" id="modal-box">
      <h3 id="modal-title" style="margin-bottom:12px;font-size:17px;font-weight:600"></h3>
      <p id="modal-body" style="font-size:14px;color:var(--text-sub);margin-bottom:24px;line-height:1.5"></p>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button class="btn-ghost" id="modal-cancel" data-action="closeOverlay">Cancel</button>
        <button class="btn-danger-sm" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
